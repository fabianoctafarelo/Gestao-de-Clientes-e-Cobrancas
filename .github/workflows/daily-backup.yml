name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 03:00 UTC (00:00 BRT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          supabase-version: latest

      - name: Gerar Dump do Banco de Dados
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backups
          TIMESTAMP="$(date +'%Y-%m-%d_%H-%M-%S')"
          BACKUP_FILE="backups/backup_${TIMESTAMP}.sql"

          echo "Conectando via API HTTPS e gerando dump..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password ""
          supabase db dump --linked -f "$BACKUP_FILE"

      - name: Registrar Backup no Repositório
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add backups/

          if ! git diff --cached --quiet; then
            git commit -m "chore(backup): automação diária do banco de dados $(date +'%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nenhum novo backup para registrar."
          fi
