name: Daily Database Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          supabase-version: latest

      - name: Generate Database Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          
          mkdir -p backups
          TIMESTAMP="$(date +'%Y-%m-%d_%H-%M-%S')"
          BACKUP_FILE="backups/backup_${TIMESTAMP}.sql"

          # Vincula o projeto ao ambiente de CI usando o token e a senha vazia/automática
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password ""
          
          # Executa o dump do projeto vinculado de forma totalmente automatizada
          supabase db dump --linked -f "$BACKUP_FILE"

      - name: Commit and Push Backup to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.BACKUP_PAT || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add backups/

          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily database backup $(date +'%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new backup to commit."
          fi
