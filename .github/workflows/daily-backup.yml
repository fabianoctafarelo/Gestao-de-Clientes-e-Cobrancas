name: Daily Database Backup

on:
  schedule:
    # Executa todos os dias à meia-noite (UTC)
    - cron: '0 0 * * *'
  # Permite rodar manualmente a partir da aba Actions do GitHub
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          supabase-version: latest

      - name: Generate Database Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          # Faz o dump do banco de dados do Supabase
          supabase db dump --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} -f "backups/backup_$TIMESTAMP.sql"

      - name: Commit and Push Backup to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "chore: automated daily database backup $(date +'%Y-%m-%d')"
          git push
