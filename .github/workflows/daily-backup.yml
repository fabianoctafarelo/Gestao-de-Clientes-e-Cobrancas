name: Daily Database Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Generate Database Dump
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          
          mkdir -p backups
          TIMESTAMP="$(date +'%Y-%m-%d_%H-%M-%S')"
          BACKUP_FILE="backups/backup_${TIMESTAMP}.sql"

          DB_HOST="db.${SUPABASE_PROJECT_ID}.supabase.co"

          # Força a extração EXCLUSIVA de um endereço IPv4 válido, ignorando completamente o IPv6
          IPV4_ADDR=$(dig +short A "$DB_HOST" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -z "$IPV4_ADDR" ]; then
            echo "Erro: Não foi possível resolver um endereço IPv4 para $DB_HOST"
            exit 1
          fi

          echo "Endereço IPv4 isolado com sucesso: $IPV4_ADDR"
          echo "Executando pg_dump nativo via IPv4..."

          # Executa o pg_dump apontando diretamente para o IP V4 com SSL ativado
          pg_dump -h "$IPV4_ADDR" -U postgres -d postgres -p 5432 --no-owner --no-acl --column-inserts -f "$BACKUP_FILE"

      - name: Commit and Push Backup to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.BACKUP_PAT || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add backups/

          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily database backup $(date +'%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new backup to commit."
          fi
