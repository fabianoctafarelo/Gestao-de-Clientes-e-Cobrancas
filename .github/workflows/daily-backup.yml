name: Daily Database Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          supabase-version: latest

      - name: Generate Database Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          
          mkdir -p backups
          TIMESTAMP="$(date +'%Y-%m-%d_%H-%M-%S')"
          BACKUP_FILE="backups/backup_${TIMESTAMP}.sql"

          # Resolve o host para IP v4 explicitamente antes de passar para o pg_dump
          DB_HOST="db.${SUPABASE_PROJECT_ID}.supabase.co"
          IPV4_ADDR=$(getent ahosts "$DB_HOST" | awk '{print $1}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -z "$IPV4_ADDR" ]; then
            echo "Erro: Não foi possível resolver o IP IPv4 para $DB_HOST"
            exit 1
          fi

          echo "Conectando ao banco via IPv4 forçado: $IPV4_ADDR"

          # Executa o dump utilizando o IP IPv4 fixo para evitar o erro de IPv6 unreachable
          supabase db dump --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@${IPV4_ADDR}:5432/postgres?sslmode=require" -f "$BACKUP_FILE"

      - name: Commit and Push Backup to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.BACKUP_PAT || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add backups/

          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily database backup $(date +'%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new backup to commit."
          fi
