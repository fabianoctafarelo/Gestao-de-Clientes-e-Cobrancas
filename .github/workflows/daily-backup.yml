name: Supabase Database Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *" # todos os dias às 03:00 UTC

jobs:
  run_db_backup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}

    steps:
      - name: Check if backups are enabled
        run: |
          if [ "$BACKUP_ENABLED" != "true" ]; then
            echo "Backups are disabled."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Create backup folder
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          mkdir -p prisma/backups/$TIMESTAMP
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Backup roles
        run: |
          supabase db dump --role-only -f prisma/backups/$TIMESTAMP/roles.sql

      - name: Backup schema
        run: |
          supabase db dump -f prisma/backups/$TIMESTAMP/schema.sql

      - name: Backup data
        run: |
          supabase db dump --data-only --use-copy -f prisma/backups/$TIMESTAMP/data.sql

      - name: Compress backup
        run: |
          tar -czf prisma/backups/${TIMESTAMP}.tar.gz \
            -C prisma/backups/$TIMESTAMP .

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.TIMESTAMP }}
          path: prisma/backups/${{ env.TIMESTAMP }}.tar.gz
          retention-days: 30

      - name: Commit backup files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/backups/
          git diff --staged --quiet || \
          git commit -m "chore: database backup $TIMESTAMP"

      - name: Push backup files
        run: |
          git push origin HEAD:${{ github.ref_name }}
